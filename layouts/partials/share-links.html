<!-- Social Share Button HTML -->
<div class="share-box" role="region">
    <ul class="share" aria-label="Social sharing" role="list">
      <!-- X -->
      <li role="listitem">
        <a href="//x.com/share?url={{ .Permalink }}&amp;text={{ .Title }}{{ with .Site.Params.author.twitter }}&amp;via={{ . }}{{ end }}" target="_blank" rel="noopener noreferrer" title="Share on X">
          <i class="fab fa-x-twitter" aria-hidden="true"></i>
          <span class="visually-hidden">Share on X</span>
        </a>
      </li>

      <!-- LINE -->
      <li role="listitem">
        <a href="//social-plugins.line.me/lineit/share?url={{ .Permalink }}&amp;text={{ .Title }}" target="_blank" rel="noopener noreferrer" title="Share on LINE">
          <i class="fab fa-line" aria-hidden="true"></i>
          <span class="visually-hidden">Share on LINE</span>
        </a>
      </li>

      <!-- Threads -->
      <li role="listitem">
        <a href="//www.threads.net/intent/post?url={{ .Permalink }}&amp;text={{ .Title }}" target="_blank" rel="noopener noreferrer" title="Share on Threads">
          <i class="fab fa-threads" aria-hidden="true"></i>
          <span class="visually-hidden">Share on Threads</span>
        </a>
      </li>

      <!-- Facebook -->
      <li role="listitem">
        <a href="//www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" rel="noopener noreferrer" title="Share on Facebook">
          <i class="fab fa-facebook" aria-hidden="true"></i>
          <span class="visually-hidden">Share on Facebook</span>
        </a>
      </li>

      <!-- Reddit -->
      <li role="listitem">
        <a href="//reddit.com/submit?url={{ .Permalink }}&amp;title={{ .Title }}" target="_blank" rel="noopener noreferrer" title="Share on Reddit">
          <i class="fab fa-reddit" aria-hidden="true"></i>
          <span class="visually-hidden">Share on Reddit</span>
        </a>
      </li>

      <!-- LinkedIn -->
      <li role="listitem">
        <a href="//www.linkedin.com/shareArticle?url={{ .Permalink }}&amp;title={{ .Title }}" target="_blank" rel="noopener noreferrer" title="Share on LinkedIn">
          <i class="fab fa-linkedin" aria-hidden="true"></i>
          <span class="visually-hidden">Share on LinkedIn</span>
        </a>
      </li>
    </ul>
  </div>
